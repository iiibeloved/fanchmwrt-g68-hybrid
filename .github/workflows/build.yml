name: g68-fanchm-build
on:
  push:
    branches: [ main ]
    paths:
      - 'device/**'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '0 18 * * 6'      # 每周日 02:00 CST（UTC 周六 18:00）
  workflow_dispatch:
    inputs:
      stage:
        description: "构建阶段：uboot=只验证 u-boot 按键链路；full=全量固件"
        type: choice
        options: [ uboot, full ]
        default: full
      publish:
        description: "是否发布 Release"
        type: boolean
        default: true
      commit_guard_result:
        description: "包清单去重结果是否自动回写 configs/（提交带 [skip ci]）"
        type: boolean
        default: true
concurrency:
  # v2：旧 group 里的 run 45295861972 runner 无响应、API cancel 不生效，
  # 换组名让含修复的构建绕过卡死的锁立即开跑。
  group: g68-fanchm-v2-${{ github.ref }}
  # watcher 失败即推修复：旧构建若继续跑会占住 group，让修好的新代码无限排队
  # （实测 45295861972 卡在 u-boot 编译，gh run cancel 未生效，新 run 一直 pending）。
  # 改成自动取消同组旧 run，保证最新 head 总能立刻开构建；守卫挂载点不受影响。
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  actions: read
  pull-requests: write
env:
  TZ: Asia/Shanghai
  FANCHM_BRANCH: fanchmwrt-25.12.6
  FANCHM_URL: https://github.com/fanchmwrt/fanchmwrt.git
  # rootfs_data 分区大小（MiB）：apply-device.sh 会把上游写死的 USERDATASIZE="2048"
  # 改成 USERDATASIZE="${ROOTFS_DATA_PARTSIZE:-4096}"，这里显式固定为 4096。
  ROOTFS_DATA_PARTSIZE: "4096"
jobs:
  # ---------- 上游变更检查（定时/手动均可，push 时跳过）----------
  check-upstream:
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.c.outputs.commit }}
      changed: ${{ steps.c.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          C=$(git ls-remote "$FANCHM_URL" "refs/heads/$FANCHM_BRANCH" | awk '{print $1}')
          echo "upstream commit: $C"
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          OLD=""
          for ref in state main; do
            content=$(gh api "repos/$GITHUB_REPOSITORY/contents/upstream.lock?ref=$ref" --jq '.content' 2>/dev/null || true)
            [ -n "$content" ] || continue
            OLD=$(echo "$content" | base64 -d | sed -n 's/^commit=//p' | head -1)
            [ -n "$OLD" ] && break
          done
          if [ -n "$OLD" ] && [ "$OLD" = "$C" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "上游未变化，跳过构建"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  # ---------- 拉源码 + 应用设备层 + 静态自检 ----------
  prepare:
    needs: check-upstream
    if: always() && (github.event_name == 'push' || needs.check-upstream.outputs.changed == 'true')
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.c.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: 浅克隆 FanchmWrt
        run: |
          set -eu
          for i in 1 2 3; do
            rm -rf fanchmwrt
            if git clone --depth 1 -b "$FANCHM_BRANCH" "$FANCHM_URL" fanchmwrt > /tmp/clone.log 2>&1; then break; fi
            echo "::warning::克隆 FanchmWrt 失败（第 $i 次），输出如下："
            cat /tmp/clone.log || true
              sleep 20
          done
          [ -d fanchmwrt/.git ] || { echo "::error::FanchmWrt 克隆失败（3 次）"; exit 1; }
          git -C fanchmwrt rev-parse HEAD > upstream.commit
          echo "commit=$(cat upstream.commit)" >> "$GITHUB_OUTPUT"
        id: c
      - name: 应用 G68 设备层
        run: set -o pipefail; sh scripts/apply-device.sh fanchmwrt 2>&1 | tee apply-device.log
      - name: 内核补丁预检（上游补丁栈 + G68 补丁，fuzz=0）
        run: set -o pipefail; sh scripts/patch-preflight.sh fanchmwrt 2>&1 | tee patch-preflight.log
      - name: 静态自检
        run: set -o pipefail; sh scripts/selftest.sh fanchmwrt 2>&1 | tee selftest.log
      - name: 打印构建目标（hybrid/dsa 一致性）
        shell: bash
        run: |
          set -euo pipefail
          CFG=$(ls configs/*.config | head -1)
          MK=fanchmwrt/target/linux/rockchip/image/armv8.mk
          BLK=$(awk '/^define Device\/nsy_g68-plus$/,/^endef$/' "$MK")
          DTS=$(printf '%s\n' "$BLK" | sed -n 's/^[[:space:]]*DEVICE_DTS := //p')
          UBOOT=$(printf '%s\n' "$BLK" | sed -n 's/^[[:space:]]*UBOOT_DEVICE_NAME := //p')
          MODEL=$(printf '%s\n' "$BLK" | sed -n 's/^[[:space:]]*DEVICE_MODEL := //p')
          g() { sed -n "s/^$1=//p" "$CFG" | head -1; }
          BOARD=$(g CONFIG_TARGET_BOARD); BOARD=${BOARD:-rockchip}
          SUB=$(g CONFIG_TARGET_SUBTARGET); SUB=${SUB:-armv8}
          [ "$(g CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus)" = "y" ] \
            || { echo "::error::未选中 G68 设备"; exit 1; }
          [ "$DTS" = "rockchip/rk3568-nsy-g68-plus" ] \
            || { echo "::error::DTS 目标不一致: ${DTS:-空}"; exit 1; }
          [ "$UBOOT" = "nsy-g68-plus-rk3568" ] \
            || { echo "::error::U-Boot 目标不一致: ${UBOOT:-空}"; exit 1; }
          {
            echo "### 构建目标 · ${{ github.event.repository.name }}"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 目标平台 | \`$BOARD/$SUB\`（aarch64_generic） |"
            echo "| 设备 | \`nsy_g68-plus\`（NSY \`$MODEL\`） |"
            echo "| 设备树 | \`$DTS\` |"
            echo "| U-Boot 目标 | \`$UBOOT\` |"
            echo "| 分区 | kernel $(g CONFIG_TARGET_KERNEL_PARTSIZE) MiB / rootfs $(g CONFIG_TARGET_ROOTFS_PARTSIZE) MiB / rootfs_data 4096 MiB |"
            echo "| 镜像 | \`*nsy_g68-plus*sysupgrade.img.gz\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 硬件级内容审核（hw-audit，dts ↔ 驱动/配置）
        run: sh scripts/hw-audit.sh
      - name: defconfig 合理性检查
        shell: bash
        run: |
          set -euo pipefail
          cd fanchmwrt
          make defconfig >/dev/null 2>&1 || true
          cp .config /tmp/default.config
          cp ../configs/g68-fanchm.config .config
          make defconfig >/dev/null 2>&1
          cp .config /tmp/ours.config
          echo "=== 关键符号（ours）==="
          for k in CONFIG_TARGET_ARCH_PACKAGES CONFIG_TARGET_BOARD CONFIG_TARGET_SUBTARGET CONFIG_USE_MUSL CONFIG_TARGET_KERNEL_PARTSIZE CONFIG_TARGET_ROOTFS_PARTSIZE CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus; do
            printf '  %-52s %s\n' "$k" "$(grep -m1 "^$k=" /tmp/ours.config || echo '-')"
          done
          echo "=== 被丢弃的符号（前 20）==="
          sed -n 's/^\(CONFIG_[A-Za-z0-9_.-]*\)=.*/\1/p' ../configs/g68-fanchm.config > /tmp/syms.txt
          # 注意：不要写成 `done ... | head -20` —— pipefail 下 head 提前退出会让 echo 收到 EPIPE 而让整步失败
          while read -r sym; do
            grep -q "^$sym=" /tmp/ours.config || echo "  DROPPED $sym"
          done < /tmp/syms.txt > /tmp/dropped.txt 2>/dev/null || true
          head -20 /tmp/dropped.txt || true
          grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus=y" /tmp/ours.config \
            || { echo "::error::defconfig 未选中 G68 设备"; exit 1; }
            # DNS：显式用 dnsmasq-full 替代上游 dnsmasq（去重规则的唯一例外）
            grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' /tmp/ours.config \
              || { echo "::error::dnsmasq-full 未选中（DNS 替换失败）"; grep -n "CONFIG_PACKAGE_dnsmasq" /tmp/ours.config || true; exit 1; }
            if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' /tmp/ours.config; then
              echo "::error::dnsmasq 与 dnsmasq-full 同时选中（PROVIDES 同名，必须互斥）"
              exit 1
            fi
            echo "[OK] DNS: 使用 dnsmasq-full（上游 dnsmasq 已排除）"
      - name: 以上游包清单为基准去重（package-guard）
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -s /tmp/default.config ]; then
            echo "::warning::上游默认 defconfig 缺失，跳过包清单去重"
            exit 0
          fi
          mkdir -p package-guard-out
          args=()
          args+=(--upstream-config /tmp/default.config)
          args+=(--hybrid-config configs/g68-fanchm.config)
          args+=(--out-dir package-guard-out)
          args+=(--json package-guard-out/report.json)
          args+=(--md package-guard-out/report.md)
          args+=(--allow dnsmasq-full)
          # swconfig：上游 rockchip 默认走 DSA，不含此用户态工具；
          # 但 G68 hybrid 的 swconfig 交换路线必须用它应用 VLAN，豁免去重注释。
          args+=(--allow swconfig)
          # 关键包豁免：package-guard 发现它们与上游同名时会生成「注释掉」的
          # 配置副本并开 PR；一旦误合并，selftest/verify-critical 会因缺包失败。
          # 这些包要么是本仓杂交价值（fcm/主题），要么是网络/SMSC 生命线，
          # 必须在 configs/g68-fanchm.config 中保持显式 =y。
          for p in kmod-fwx fwxd libfwx_common kmod-shortcut-fe kmod-nft-fullcone \
                   luci-app-fwx-dashboard luci-theme-fanchmwrt \
                   kmod-switch-rtl8366-smi kmod-switch-rtl8367b \
                   kmod-phy-smsc kmod-usb-net-smsc95xx; do
            args+=(--allow "$p")
          done
          [ -f configs/builtin-list.txt ] && args+=(--builtin-list configs/builtin-list.txt)
          for f in fanchmwrt/feeds/*.index; do [ -f "$f" ] && args+=(--index "$f"); done
          args+=(--makefile-dir fanchmwrt/package --makefile-dir fanchmwrt/feeds)
          echo "package-guard: ${args[*]}"
          python3 scripts/package-guard.py "${args[@]}" || echo "::warning::package-guard 返回非零（仅报告，不阻塞）"
          if [ -f package-guard-out/report.md ]; then cat package-guard-out/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 上传包清单去重报告
        uses: actions/upload-artifact@v4
        with:
          name: package-guard-report
          path: package-guard-out/
          if-no-files-found: warn
          retention-days: 30
      - name: 回写去重结果到 configs/（开 PR，main 受保护）
        if: ${{ github.event_name != 'pull_request' && !contains(github.event.inputs.commit_guard_result, 'false') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ ! -s package-guard-out/builtin-list.txt ] || [ ! -s package-guard-out/g68-fanchm.config ]; then
            echo "无去重结果，跳过回写"
            exit 0
          fi
          cp package-guard-out/builtin-list.txt configs/builtin-list.txt
          cp package-guard-out/g68-fanchm.config configs/g68-fanchm.config
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/builtin-list.txt configs/g68-fanchm.config
          if git diff --cached --quiet; then echo "无重复项，无需回写"; exit 0; fi
          # main 受分支保护，GITHUB_TOKEN 不能直推；改推同仓分支并开 PR，由维护者合并。
          BRANCH="pkg-guard/dedupe"
          git checkout -B "$BRANCH"
          git commit -m "chore(packages): 以上游包清单为基准注释重复项"
          if ! git push --force origin "$BRANCH"; then
            echo "::warning::推送 $BRANCH 失败，跳过本次回写（下次构建会重新生成）"
            exit 0
          fi
          BODY=$(cat <<'EOF'
          本 PR 由 CI 的 package-guard 自动生成：以上游 FanchmWrt 默认包清单为基准，
          注释与本仓库重复或冲突的第三方包（行尾标注 `# [package-guard] ...`）。

          合并后仓库配置与本次构建所用清单一致；若不需要，直接关闭即可，下次构建会重新生成。
          EOF
          )
          TITLE="chore(packages): 以上游包清单为基准注释重复项"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
            echo "已更新 PR: $(gh pr view "$BRANCH" --json url --jq .url)"
          elif gh pr create --head "$BRANCH" --base main --title "$TITLE" --body "$BODY"; then
            echo "已创建 PR: $(gh pr view "$BRANCH" --json url --jq .url)"
          else
            echo "::warning::PR 创建失败（需仓库允许 Actions 创建 PR + pull-requests: write），分支 $BRANCH 已推送"
            echo "::notice::可手动比较：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH"
          fi
      - name: 上传自检报告
        uses: actions/upload-artifact@v4
        with:
          name: selftest-report
          path: |
            apply-device.log
            patch-preflight.log
            selftest.log
          if-no-files-found: warn
  # ---------- u-boot 单独构建 + 按键链路断言 ----------
  uboot-check:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 拉源码并应用设备层
        run: |
          set -eu
          for i in 1 2 3; do
            rm -rf fanchmwrt
            if git clone --depth 1 -b "$FANCHM_BRANCH" "$FANCHM_URL" fanchmwrt > /tmp/clone.log 2>&1; then break; fi
            echo "::warning::克隆 FanchmWrt 失败（第 $i 次），输出如下："
            cat /tmp/clone.log || true
              sleep 20
          done
          [ -d fanchmwrt/.git ] || { echo "::error::FanchmWrt 克隆失败（3 次）"; exit 1; }
          sh scripts/apply-device.sh fanchmwrt
          sh scripts/selftest.sh fanchmwrt
      - name: 安装编译依赖（容错版）
        run: |
          set -uo pipefail
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 rsync swig unzip zlib1g-dev file wget curl ca-certificates ccache time python3-pyelftools python3-setuptools python3-dev libgnutls28-dev device-tree-compiler bc bzip2 patch perl cpio xsltproc"
          apt_ok=0
          for i in 1 2 3 4 5 6; do
            echo "== apt 尝试 $i/6 =="
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq 2>/dev/null; then
              if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $PKGS 2>/dev/null; then apt_ok=1; break; fi
            fi
            sleep 20
          done
          if [ "$apt_ok" != "1" ]; then
            echo "::warning::apt 源不可用（DNS/镜像问题），改为校验运行器已有工具"
          fi
          missing=""
          for t in gcc make gawk gettext wget unzip python3 swig rsync bc cpio git file bzip2 perl; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then echo "::error::缺少关键工具:$missing（apt 与预装均不可用）"; exit 1; fi
          python3 -c 'import elftools' 2>/dev/null || python3 -m pip install --quiet pyelftools 2>/dev/null || echo "::warning::pyelftools 缺失（后续 RK 打包可能需要，若失败再处理）"
          gcc --version | head -1
          ccache --version 2>/dev/null | head -1 || echo "::warning::无 ccache（仅影响缓存速度）"
          python3 --version
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)' 2>/dev/null || true
      - name: 更新 feeds
        run: |
          cd fanchmwrt
          ./scripts/feeds update -a >/dev/null
          sh ../scripts/feed-pin.sh . ../configs/feeds.lock
          ./scripts/feeds install -a >/dev/null
          echo "feeds 安装完成"
      - name: 只编译 u-boot
        shell: bash
        run: |
          set -euo pipefail
          cd fanchmwrt
          cp ../configs/g68-fanchm.config .config
          make defconfig
          grep -q "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus=y" .config || \
            { echo "::error::defconfig 未选中 G68 设备"; grep -E "TARGET_rockchip" .config | head; exit 1; }
          make -j"$(nproc)" tools/install 2>&1 | tail -5
          make -j"$(nproc)" toolchain/install 2>&1 | tail -10
          ls -l staging_dir/toolchain-*/lib/ld-musl-*.so* | head -3
          make -j"$(nproc)" package/boot/uboot-rockchip/compile V=s 2>&1 | tail -40
      - name: 核心功能守卫（长按 Reset→MaskROM 产物级校验）
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-maskrom.sh fanchmwrt --built
  build:
    needs: [ prepare, uboot-check ]
    if: always() && needs.prepare.result == 'success' && needs.uboot-check.result == 'success' && (inputs.stage == 'full' || github.event_name != 'workflow_dispatch')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 拉源码并应用设备层
        run: |
          set -eu
          for i in 1 2 3; do
            rm -rf fanchmwrt
            if git clone --depth 1 -b "$FANCHM_BRANCH" "$FANCHM_URL" fanchmwrt > /tmp/clone.log 2>&1; then break; fi
            echo "::warning::克隆 FanchmWrt 失败（第 $i 次），输出如下："
            cat /tmp/clone.log || true
              sleep 20
          done
          [ -d fanchmwrt/.git ] || { echo "::error::FanchmWrt 克隆失败（3 次）"; exit 1; }
          sh scripts/apply-device.sh fanchmwrt
          sh scripts/selftest.sh fanchmwrt
          # 官方 feeds 之后再按名安装 FanchmWrt 官方缺失的包
          # 同名包来源由 configs/feed-precedence.txt 统一声明（如 sing-box 取 small）
          ( cd fanchmwrt
            ./scripts/feeds update -a >/dev/null
            sh ../scripts/feed-pin.sh . ../configs/feeds.lock
            ./scripts/feeds install -a >/dev/null
            for p in                      luci-app-ddns-go ddns-go \
                     luci-app-openclash luci-app-passwall luci-app-homeproxy \
                     sing-box xray-core geoview smartdns haproxy shadowsocks-rust \
                     shadowsocksr-libev simple-obfs v2ray-plugin chinadns-ng dns2socks microsocks tcping; do
              ./scripts/feeds install "$p" >/dev/null 2>&1 || echo "::warning::feeds install $p 失败（该包将被跳过）"
            done
            # 同名包来源优先级：删官方旧链接、从指定 feed 重装、校验生效路径
            sh ../scripts/feed-sources.sh . ../configs/feed-precedence.txt
            echo "=== small 已装包 ==="; ls package/feeds/small 2>/dev/null | tr '\n' ' '; echo
            # Go 工具链：FanchmWrt 的 golang 1.23 固定 GOTOOLCHAIN=local，而 small 的
            # xray-core / sing-box / ddns-go 的 go.mod 要求 go>=1.25，
            # local 模式下必然报 "requires go >= 1.25.0"。改为 auto：
            # go 按各包 go.mod 自动下载所需 host 工具链（仅 host 端自举，
            # 交叉编译目标仍是 aarch64_generic）。
            n=0
            while IFS= read -r f; do
              sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/g' "$f"
              echo "Go 工具链已放宽: $f"
              n=$((n+1))
            done < <(grep -rl 'GOTOOLCHAIN=local' feeds/packages/lang/golang/ 2>/dev/null || true)
            [ "$n" -gt 0 ] || echo "::warning::未找到 GOTOOLCHAIN=local（golang 包结构可能变化）"
          )
          cp configs/g68-fanchm.config fanchmwrt/.config
          cd fanchmwrt
          make defconfig 2>&1 | tail -20
          # ext4 rootfs 二次压回：FanchmWrt 基线 TARGET_ROOTFS_EXT4FS 为
          # "default y if USES_EXT4"，rockchip FEATURES 含 ext4，defconfig 会把它
          # 拉回 y，镜像阶段对未压缩 rootfs 树（约 691MiB）跑 make_ext4fs -l 500MiB
          # 必然 out of space。这里在 defconfig 后强制压回并校验。
          sed -i -E 's/^CONFIG_TARGET_ROOTFS_EXT4FS=y$/# CONFIG_TARGET_ROOTFS_EXT4FS is not set/' .config
          if grep -q '^CONFIG_TARGET_ROOTFS_EXT4FS=y$' .config; then
            echo "::error::ext4 rootfs 仍为 y，镜像阶段将因 make_ext4fs 容量不足失败"
            exit 1
          fi
          grep -q '^CONFIG_TARGET_ROOTFS_SQUASHFS=y$' .config \
            || { echo "::error::squashfs 未选中（ext4 关闭后将无可用镜像）"; exit 1; }
          echo "[OK] ext4 rootfs 已关闭，仅保留 squashfs"
          echo "=== 关键配置确认 ==="
          grep -E "CONFIG_TARGET_rockchip_armv8_DEVICE_nsy_g68-plus|CONFIG_TARGET_KERNEL_PARTSIZE|CONFIG_TARGET_ROOTFS_PARTSIZE|CONFIG_PACKAGE_luci-theme-fanchmwrt|CONFIG_PACKAGE_luci-app-store|CONFIG_PACKAGE_luci-app-quickstart" .config || true
          grep -q '^CONFIG_PACKAGE_dnsmasq-full=y$' .config || { echo "::error::dnsmasq-full 未选中（DNS 替换失败）"; exit 1; }
          if grep -q '^CONFIG_PACKAGE_dnsmasq=y$' .config; then
            echo "::error::dnsmasq 与 dnsmasq-full 同时选中（PROVIDES 同名，必须互斥）"
            exit 1
          fi
          # 通用依赖守卫：遍历所有选中包的版本化依赖并校验同名包来源，
          # 在 defconfig 后秒级拦截上游 feed 漂移，避免编译 3 小时后才失败。
          sh ../scripts/dep-guard.sh . ../configs/feed-precedence.txt
          # 核心网络包守卫（defconfig 后）：selftest 只查 config 输入，这里查
          # defconfig 展开后的真实 .config —— 防上游 feed 漂移让 swconfig 四件套
          # 或 dnsmasq-full 被静默丢弃（曾导致真机 LAN 拿不到 IP）。
          sh ../scripts/verify-critical.sh config .config
      - name: 包集可用性审计（声明 vs defconfig 实得）
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f fanchmwrt/.config ]; then
            echo "::warning::未找到 fanchmwrt/.config，跳过包集可用性审计"
            exit 0
          fi
          awk -F= '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{print $1}' configs/g68-fanchm.config | sort -u > /tmp/want.txt || true
          awk -F= '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{print $1}' fanchmwrt/.config | sort -u > /tmp/have.txt || true
          comm -23 /tmp/want.txt /tmp/have.txt > /tmp/dropped.txt || true
          W=$(wc -l < /tmp/want.txt); D=$(wc -l < /tmp/dropped.txt)
          {
            echo "### 包集可用性审计"
            echo ""
            echo "- config 声明（=y）：**$W** 个"
            echo "- defconfig 未接受（上游 feed 无此包 / 依赖不满足）：**$D** 个"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$D" -gt 0 ]; then
            echo "::warning::$D 个声明的包在 FanchmWrt feeds 中不可用（被 defconfig 丢弃），详见 job summary"
            {
              echo ""
              echo "| 丢弃的包 |"
              echo "| --- |"
              sed 's/^CONFIG_PACKAGE_//; s/^/| /; s/$/ |/' /tmp/dropped.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[audit] 声明 $W / 丢弃 $D"
      - name: 缓存 dl
        uses: actions/cache@v4
        with:
          path: fanchmwrt/dl
          key: dl-${{ github.run_id }}
          restore-keys: |
            dl-
      - name: 安装编译依赖（容错版）
        run: |
          set -uo pipefail
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 rsync swig unzip zlib1g-dev file wget curl ca-certificates ccache time python3-pyelftools python3-setuptools python3-dev libgnutls28-dev device-tree-compiler bc bzip2 patch perl cpio xsltproc"
          apt_ok=0
          for i in 1 2 3 4 5 6; do
            echo "== apt 尝试 $i/6 =="
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq 2>/dev/null; then
              if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $PKGS 2>/dev/null; then apt_ok=1; break; fi
            fi
            sleep 20
          done
          if [ "$apt_ok" != "1" ]; then
            echo "::warning::apt 源不可用（DNS/镜像问题），改为校验运行器已有工具"
          fi
          missing=""
          for t in gcc make gawk gettext wget unzip python3 swig rsync bc cpio git file bzip2 perl; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then echo "::error::缺少关键工具:$missing（apt 与预装均不可用）"; exit 1; fi
          python3 -c 'import elftools' 2>/dev/null || python3 -m pip install --quiet pyelftools 2>/dev/null || echo "::warning::pyelftools 缺失（后续 RK 打包可能需要，若失败再处理）"
          gcc --version | head -1
          ccache --version 2>/dev/null | head -1 || echo "::warning::无 ccache（仅影响缓存速度）"
          python3 --version
          python3 -c 'import elftools; print("pyelftools", elftools.__version__)' 2>/dev/null || true
      - name: 核心功能守卫（编译前，防被覆盖）
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/verify-maskrom.sh fanchmwrt
      - name: 编译固件
        shell: bash
        run: |
          set -euo pipefail
          cd fanchmwrt
          if ! make -j"$(nproc)" 2>&1 | tee ../build.log; then
            echo "::warning::并行构建失败，单线程重试（V=s）"
            make -j1 V=s 2>&1 | tee -a ../build.log
          fi
      - name: 收集产物
        run: |
          set -eu
          # 产物守卫：只接受 squashfs sysupgrade，禁止 ext4 rootfs 变体混入发布。
          # 若 defconfig 二次压回失效让 ext4 镜像被造出，这里直接失败而不是发错固件。
          IDIR=fanchmwrt/bin/targets/rockchip/armv8
          EXT4_IMG=$(find "$IDIR" -maxdepth 1 -name '*ext4*.img.gz' -print -quit 2>/dev/null || true)
          if [ -n "$EXT4_IMG" ]; then
            echo "::error::检测到非预期的 ext4 rootfs 镜像（ext4 应已关闭）: $EXT4_IMG"
            exit 1
          fi
          IMG=$(find "$IDIR" -name '*squashfs-sysupgrade.img.gz' | head -1)
          [ -n "$IMG" ] || IMG=$(find "$IDIR" -name '*nsy_g68-plus*sysupgrade.img.gz' | head -1)
          [ -n "$IMG" ] || { echo "::error::未找到 squashfs sysupgrade 固件镜像"; ls -l "$IDIR" 2>/dev/null || true; exit 1; }
          cp "$IMG" .
          # 校验 rootfs_data=4096MiB：必须读 MBR 分区表，不能用镜像体积。
          # 上游 pine64-img 未设置 PADDING，gen_image_generic.sh 不会把 userdata 分区
          # dd 填零，镜像文件只有 kernel+rootfs（约 216 MiB），但分区表标称 4096 MiB。
          # check-partition-table.py 只读 gzip 流前 512 字节，无需解压整盘。
          python3 scripts/check-partition-table.py "$IMG" "$ROOTFS_DATA_PARTSIZE"
          # 网络链路"应用后"守卫：包齐全 ≠ 网络可用。上游增量改动 dwmac-rk.c /
          # rk3568 dts 上下文会让 910/913/915 内核补丁 hunk 静默 FAILED，编译仍成功
          # 但刷入后 LAN 拿不到 IP（历史事故 c6d9bc6）。这里检查打过补丁的内核源码
          # 确实含 MAC select 编程 / fixed-link 处理 / RTL8367S 驱动，缺任一禁止发布。
          KDIR=$(ls -d fanchmwrt/build_dir/target-*/linux-rockchip_armv8/linux-6.12.* 2>/dev/null | head -1 || true)
          [ -n "$KDIR" ] || { echo "::error::找不到打补丁后的内核源码树，无法验证网络补丁生效"; exit 1; }
          sh scripts/verify-network.sh source "$KDIR"
          dts=$(ls fanchmwrt/build_dir/target-*/linux-rockchip_armv8/linux-6.12.*/arch/arm64/boot/dts/rockchip/rk3568-nsy-g68-plus.dts 2>/dev/null | head -1 || true)
          [ -n "$dts" ] && sh scripts/verify-network.sh dts "$dts" \
            || echo "::warning::未在内核源码树找到板级 dts（prepare 阶段已校验投递版，跳过产物级 dts 复查）"
          SHA=$(sha256sum "$(basename "$IMG")" | awk '{print $1}')
          CNT=$(grep -h ' - ' fanchmwrt/bin/targets/rockchip/armv8/*.manifest 2>/dev/null | wc -l)
          cat fanchmwrt/bin/targets/rockchip/armv8/*.manifest > ./packages.manifest
          # 最终 manifest 守卫：确认真正进镜像的包齐全，缺任一网络/DHCP 生命线包
          # 则禁止发布 Release（defconfig 后的守卫之外再加一道产物级兜底）。
          sh scripts/verify-critical.sh manifest packages.manifest
          sha256sum "$(basename "$IMG")" > sha256sums
          echo "IMG=$(basename "$IMG")" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "PKGCOUNT=$CNT" >> "$GITHUB_ENV"
          [ -f "fanchmwrt/bin/targets/rockchip/armv8/$(basename "$IMG" .gz).sha256" ] && cp "fanchmwrt/bin/targets/rockchip/armv8/$(basename "$IMG" .gz).sha256" . || true
          ls -lh "$(basename "$IMG")"
      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: 上传固件 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: g68-fanchm-image-${{ github.run_number }}
          path: |
            *.img.gz
            *.sha256
            *.sha256sums
          retention-days: 14
      - name: 发布 Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          BASE="g68-fanchm-$(date -u +%Y.%m.%d)"
          TAG="$BASE"; n=1
          while gh release view "$TAG" >/dev/null 2>&1; do TAG="$BASE-r$n"; n=$((n+1)); done
          {
            echo "## NSY G68-PLUS (RK3568) · FanchmWrt 杂交固件"
            echo ""
            echo "- 基座: FanchmWrt \`$FANCHM_BRANCH\`（OpenWrt 25.12 / 内核 6.12 / apk）@ \`$(git -C fanchmwrt rev-parse --short HEAD)\`"
            echo "- 设备层: NSY G68 swconfig 双 GMAC（真机验证路线）+ 长按 Reset 进 MaskROM u-boot overlay"
            echo "- 行为管理: FanchmWrt 原生 fcm（fwx.ko + fwxd + shortcut-fe + 主题）"
            echo "- 包数: **${PKGCOUNT}** 个"
            echo "- 镜像 sha256: \`${SHA}\`"
            echo ""
            echo "### 长期目标（守卫固化，上游更新不得削弱）"
            echo "1. 长按复位键进 MaskROM（u-boot overlay + verify-maskrom 三层断言）"
            echo "2. 网络生命线 swconfig/rtl8367b/dnsmasq-full + 910/913/915 补丁（verify-network source/dts）"
            echo "3. 核心应用能力与 hybrid 对齐（蜂窝 32 包移除、SMSC 驱动保留）；风格为 FanchmWrt 原生：无 QuickStart、无应用商城、无 Argon 主题"
            echo ""
            echo "### 刷机（长按 Reset 进 MaskROM）"
            echo "1. USB 双公头线连接电脑与设备（OTG/靠网口 USB）"
            echo "2. RKDevTool v3.18 + 驱动 v5.12"
            echo "3. 断电 → **按住 Reset** 上电 → 松开 → 显示 MaskROM 设备"
            echo "4. 高级功能 → Boot 选 \`rk356x_spl_loader_v1.21.113.bin\` → 下载"
            echo "5. 获取当前存储 / **擦除所有**"
            echo "6. 下载镜像（解压后的 .img）→ **勾选「强制按地址写」** → 执行"
            echo ""
            echo "> 若长按无效，可用短接触点法兜底（BROM 模式，loader 相同）"
          } > notes.md
          gh release create "$TAG" *.img.gz sha256sums packages.manifest --title "G68 FanchmWrt 杂交固件 $TAG" --notes-file notes.md || \
            gh release upload "$TAG" *.img.gz sha256sums packages.manifest --clobber
      - name: 回写 upstream.lock
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          {
            printf 'branch=%s\n' "$FANCHM_BRANCH"
            printf 'commit=%s\n' "$(git -C fanchmwrt rev-parse HEAD)"
            printf 'feeds:\n'
            for d in fanchmwrt/feeds/*/; do
              [ -d "$d/.git" ] || continue
              printf '  %s %s\n' "$(basename "$d")" "$(git -C "$d" rev-parse HEAD 2>/dev/null || echo unknown)"
            done
          } > upstream.lock
          git add upstream.lock
          git commit -m "chore: 记录已构建的 FanchmWrt 上游 commit [skip ci]" || true
          # main 受保护（protected branch hook 会拒绝 GITHUB_TOKEN），改推 state 分支
          git push --force origin HEAD:state || echo "::warning::upstream.lock 回写推送失败（state 分支）"
          echo "---- upstream.lock ----"; cat upstream.lock
      - name: 失败时自动开 issue（同类复用，不重复开）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TITLE="CI 构建失败: $GITHUB_RUN_NUMBER"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          FAILED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || echo "未知")
          BODY=$(cat <<EOF
          ## 构建失败
          | 项目 | 值 |
          | --- | --- |
          | 运行 | [#$GITHUB_RUN_NUMBER]($RUN_URL) |
          | 提交 | \`${GITHUB_SHA:0:8}\` |
          | 触发方式 | ${GITHUB_EVENT_NAME} |
          | 失败步骤 | ${FAILED} |
          ### 排查
          1. 打开 [运行日志]($RUN_URL)，展开失败步骤（编译步骤已 tee 全量日志到 build.log artifact）；
          2. 修复后重新触发构建，成功时该 issue 会自动关闭。
          > 同一根因的连续失败会追加评论到本 issue，不再重复新建。
          EOF
          )
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '[.[] | select(.title | startswith("CI 构建失败")) | .number] | first // empty' 2>/dev/null || true)
          if [ -n "${EXISTING:-}" ]; then
            echo "已有未关闭的失败 issue #$EXISTING，追加评论"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY" || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || true
          fi
      - name: 成功时自动关闭失败 issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          NUMS=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.title | startswith("CI 构建失败")) | .number' 2>/dev/null || true)
          for n in $NUMS; do
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" \
              --body "构建已通过（run #$GITHUB_RUN_NUMBER，提交 \`${GITHUB_SHA:0:8}\`），自动关闭。" || true
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --reason completed || true
            echo "已关闭 issue #$n"
          done
          if [ -z "$NUMS" ]; then echo "没有未关闭的失败 issue"; fi
          exit 0
